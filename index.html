<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Judith — Saint-Thuriau · Chapitre 8 — Le secret des étoiles</title><style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#fff;font:15px system-ui;text-align:center}h1{font-size:clamp(16px,3vw,24px);margin:9px 4px 3px;color:#f4dcad}.hint{font-size:12px;color:#c6d5dd;margin-bottom:8px}#game{display:block;width:min(100vw,1100px);aspect-ratio:3/2;margin:auto;border:2px solid #bb9459;touch-action:none;background:#182b32}.ui{width:min(100vw,1100px);margin:auto;padding:9px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,48px);gap:4px;flex:none}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1;grid-row:2}.pad button:nth-child(3){grid-column:2;grid-row:2}.pad button:nth-child(4){grid-column:3;grid-row:2}button{touch-action:none;user-select:none;border:1px solid #d9b779;border-radius:11px;background:#324967;color:white;font-size:20px}.act{padding:13px;font-size:15px;max-width:140px}#info{flex:1;text-align:left;font-size:13px;color:#f5e8d3;min-width:0}@media(max-width:520px){.pad{grid-template-columns:repeat(3,43px);grid-template-rows:repeat(2,42px)}.act{font-size:12px;padding:8px}#info{font-size:11px}}</style></head><body><h1>✦ Judith et la Légende de la Danse ✦</h1><div class="hint">Saint-Thuriau · Le secret des étoiles · Quête du vieux quartier</div><canvas id="game" width="960" height="640"></canvas><div class="ui"><div class="pad"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div id="info">Place Judith sur le seuil, puis appuie sur « Parler / Entrer ».<br>Flèches / ZQSD · Espace : interagir</div><button class="act" id="act">Parler / Entrer</button><button class="act" id="journal">Journal</button><button class="act" id="save">Sauver</button></div><script>
'use strict';
const c=document.getElementById('game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const imgs={};for(const k of ['place','judith','library','studio','marceau','nadege','isabelle','quartier']){imgs[k]=new Image();imgs[k].src='assets/'+k+(['library','studio','quartier'].includes(k)?'.jpg':'.png')}
let scene='place',px=760,py=690,dir='down',phase=0,dialog='',quest=false,friend=false,book=false,camx=0,camy=0,steps=0,visitedQuartier=false,foundNotice=false,foundFountain=false,starQuest=false,starDelivered=false;
try{const v=JSON.parse(localStorage.getItem('judith_ch8')||localStorage.getItem('judith_ch7')||'null');if(v){scene=['place','studio','library','quartier'].includes(v.scene)?v.scene:'place';px=+v.px||760;py=+v.py||690;quest=!!v.quest;friend=!!v.friend;book=!!v.book;visitedQuartier=!!v.visitedQuartier;foundNotice=!!v.foundNotice;foundFountain=!!v.foundFountain;starQuest=!!v.starQuest;starDelivered=!!v.starDelivered}}catch(e){}
function save(){try{localStorage.setItem('judith_ch8',JSON.stringify({scene,px,py,quest,friend,book,visitedQuartier,foundNotice,foundFountain,starQuest,starDelivered}));dialog='Progression sauvegardée sur cet appareil.'}catch(e){dialog='Sauvegarde indisponible.'}}
const keys=new Set();function dist(x,y,a,b){return Math.hypot(x-a,y-b)}
const npcs={place:[{x:950,y:585,k:'marceau',name:'Marceau',w:47,h:91}],studio:[{x:660,y:423,k:'nadege',name:'Nadège',w:75,h:143}],library:[{x:632,y:405,k:'isabelle',name:'Isabelle',w:71,h:134}]};

function npc(n){g.fillStyle='#0005';g.beginPath();g.ellipse(n.x,n.y-3,n.w*.30,5,0,0,Math.PI*2);g.fill();drawImg(n.k,n.x-n.w/2,n.y-n.h,n.w,n.h);label(n.name,n.x,n.y-n.h-7,15,'#ffe7b0')}
function canWalk(x,y){if(scene==='quartier')return x>95&&x<1460&&y>360&&y<935&&!(x>790&&y<535)&&!(x<310&&y<480)&&!(x>1110&&y<635)&&!(x>810&&x<1150&&y>650&&y<820);if(scene==='studio')return x>95&&x<870&&y>270&&y<565&&!(x<185&&y<400)&&!(x>785&&y<420);if(scene==='library')return x>85&&x<875&&y>320&&y<568&&!(x<325&&y<435)&&!(x>650&&y<330)&&!(x<235&&y>510);if(x<185||x>1480||y<357||y>935)return false;if(y<420&&(x<390||x>1435))return false;if(y<422&&!(Math.abs(x-492)<92||Math.abs(x-1354)<95))return false;if(y>810&&(x<335||x>1160))return false;if(x<330&&y>620)return false;if(x>1170&&y>725)return false;return true}
function enter(which){scene=which;px=480;py=540;dir='up';phase=0;dialog=''}
function exitRoom(){const old=scene;scene='place';px=old==='studio'?492:1354;py=422;dir='down';phase=0;dialog=''}
function interact(){if(dialog){dialog='';return}if(scene==='quartier'){
 if(px<220&&py>545&&py<805){scene='place';px=1380;py=595;dir='left';dialog='';return}
 if(dist(px,py,875,595)<170){foundNotice=true;starQuest=true;dialog='Panneau : « Le secret des étoiles : trouve le symbole de la fontaine puis demande à Isabelle de consulter le vieux livre. »';return}
 if(dist(px,py,1045,825)<195){foundFountain=true;dialog=starQuest?'Sur la fontaine, Judith déchiffre une étoile à huit branches. Isabelle saura peut-être ce qu’elle signifie !':'Une étoile à huit branches est gravée sur la fontaine. Le panneau près de l’église en parle peut-être !';return}
 dialog='Explore le panneau et la fontaine, puis retourne voir Isabelle à la bibliothèque.';return}
 if(scene!=='place'){if(py>505&&px>360&&px<605){exitRoom();return}const n=npcs[scene][0];if(dist(px,py,n.x,n.y)<175){if(scene==='studio'){quest=true;dialog='Nadège : Bravo Judith ! Tu apprends la 4e jazz. Va retrouver Marceau sur la place !'}else{book=true;if(foundNotice&&foundFountain&&!starDelivered){starDelivered=true;dialog='Isabelle : Bravo ! L’étoile de la fontaine est le sceau des quatre danses. Rapporte cette découverte à Marceau sur la place !'}else{dialog='Isabelle : Le Livre des quatre danses renferme des secrets. Explore le vieux quartier et sa fontaine !'}}return}if(scene==='library'&&dist(px,py,430,375)<155){book=true;dialog='Judith découvre le Livre des quatre danses, caché parmi les ouvrages anciens.';return}dialog='Approche-toi de '+n.name+' ou de la sortie en bas.';return}
// Entrées manuelles au seuil; le passage vers le quartier est distinct.
if(Math.abs(px-492)<48&&py>=365&&py<=401){enter('studio');return}
if(Math.abs(px-1354)<48&&py>=367&&py<=405){enter('library');return}
if(px>1350&&py>500&&py<725){scene='quartier';px=195;py=700;dir='right';visitedQuartier=true;dialog='Judith découvre le quartier de l’église ! Cherche le panneau et la fontaine.';return}
const n=npcs.place[0];if(dist(px,py,n.x,n.y)<120){if(starDelivered){friend=true;dialog='Marceau : Incroyable ! Tu as découvert le sceau des quatre danses ! Notre aventure peut continuer. ✓ Quête du quartier terminée !'}else if(quest){friend=true;dialog='Marceau : Bravo Judith ! Tu as appris la 4e jazz ! Allons voir Isabelle à la bibliothèque.'}else dialog='Marceau : Nadège t’attend à l’école de danse !';return}
dialog='Place Judith juste devant la porte, puis appuie sur Entrer.'}
function render(){g.clearRect(0,0,960,640);if(scene==='quartier'){camx=Math.max(0,Math.min(1536-960,px-480));camy=Math.max(0,Math.min(1024-640,py-380));g.save();g.translate(-Math.round(camx),-Math.round(camy));drawImg('quartier',0,0,1536,1024);judith(px,py,1.12);label('Judith',px,py-126,16);if(px<260&&py>520&&py<840)label('◀ RETOUR À LA PLACE',245,580,19,'#ffedb1');if(dist(px,py,875,595)<200)label('✦ PANNEAU',875,500,18,'#ffedb1');if(dist(px,py,1045,825)<205)label('✦ FONTAINE',1045,695,18,'#ffedb1');g.restore()}else if(scene==='place'){camx=Math.max(0,Math.min(1536-960,px-480));camy=Math.max(0,Math.min(1024-640,py-380));g.save();g.translate(-Math.round(camx),-Math.round(camy));drawImg('place',0,0,1536,1024);for(const n of npcs.place)npc(n);judith(px,py,1.12);label('Judith',px,py-126,16);if(px>1300&&py>480&&py<730)label('➜ QUARTIER DE L’ÉGLISE',1340,470,18,'#ffedb1');if(Math.abs(px-492)<54&&py>=358&&py<=410)label('✦ ENTRER : ÉCOLE',492,280,18,'#ffedb1');if(Math.abs(px-1354)<54&&py>=358&&py<=410)label('✦ ENTRER : BIBLIOTHÈQUE',1354,280,18,'#ffedb1');g.restore()}else{drawImg(scene,0,0,960,640);for(const n of npcs[scene])npc(n);judith(px,py,1.28);label('Judith',px,py-142,16);if(py>465)label('▼ SORTIE',480,601,19,'#fff0b0')}
rect(12,12,420,50,'#16263cdd');label(scene==='place'?'Saint-Thuriau · Place du village':scene==='quartier'?'Saint-Thuriau · Quartier de l’église':scene==='studio'?'École de danse · Nadège':'Bibliothèque · Isabelle',25,43,19,'#ffe7b0','left');rect(12,70,390,52,'#16263cdd');label(starDelivered?'✓ Sceau des quatre danses découvert':foundNotice&&foundFountain?'Quête : rapporter le secret à Isabelle':starQuest?'Quête : examiner la fontaine':visitedQuartier?'Quartier : lire le panneau':book?'✓ Livre des quatre danses trouvé':friend?'✓ Marceau retrouvé':quest?'Quête : retrouver Marceau':'Quête : parler à Nadège',25,101,17,'#fff1d0','left');if(dialog){rect(65,471,830,137,'#17253bef');g.strokeStyle='#f0c883';g.lineWidth=4;g.strokeRect(65,471,830,137);g.textAlign='left';g.font='19px system-ui';g.fillStyle='#fff';let line='',y=508;for(const word of dialog.split(' ')){let test=line+word+' ';if(g.measureText(test).width>770){g.fillText(line,88,y);y+=27;line=word+' '}else line=test}g.fillText(line,88,y);g.font='14px system-ui';g.fillText('Appuie sur « Parler / Entrer » pour continuer',88,588)}}
let last=performance.now();function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;let dx=+keys.has('right')-+keys.has('left'),dy=+keys.has('down')-+keys.has('up');if((dx||dy)&&!dialog){let m=Math.hypot(dx,dy),sx=dx/m*170*dt,sy=dy/m*170*dt;dir=Math.abs(sx)>Math.abs(sy)?sx>0?'right':'left':sy>0?'down':'up';if(canWalk(px+sx,py))px+=sx;if(canWalk(px,py+sy))py+=sy;phase+=dt*2.4;steps+=dt;if(scene==='place'&&px>1430&&py>490&&py<710){scene='quartier';px=165;py=700;visitedQuartier=true;dialog='Bienvenue dans le quartier de l’église !'}else if(scene==='quartier'&&px<120&&py>530&&py<850){scene='place';px=1390;py=595;dialog=''}/* Les portes nécessitent désormais une action explicite. */}else phase=0;render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function keyDir(k){return({ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',z:'up',Z:'up',q:'left',Q:'left',s:'down',S:'down',d:'right',D:'right',w:'up',a:'left'})[k]}
addEventListener('keydown',e=>{let d=keyDir(e.key);if(d){keys.add(d);e.preventDefault()}if([' ','Enter','e','E'].includes(e.key)){interact();e.preventDefault()}});addEventListener('keyup',e=>{let d=keyDir(e.key);if(d)keys.delete(d)});addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);keys.add(d);e.preventDefault()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys.delete(d))});document.getElementById('act').onclick=interact;document.getElementById('save').onclick=save;document.getElementById('journal').onclick=()=>{dialog=starDelivered?'Journal : Le sceau des quatre danses est découvert. Va raconter la nouvelle à Marceau !':foundNotice&&foundFountain?'Journal : Les deux indices sont réunis. Retourne parler à Isabelle.':starQuest?'Journal : Le panneau parle du symbole caché sur la fontaine. Examine la fontaine !':'Journal : Lis le panneau du quartier de l’église, puis cherche la fontaine.'};
</script></body></html>
